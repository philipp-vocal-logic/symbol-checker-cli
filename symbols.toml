[settings]
include = ["src/**/*.py", "tests/**/*.py"]
exclude = []
forbidden_subwords = [
    "data",
    "info",
    "item",
    "obj",
    "val",
    "temp",
    "mgr",
    "manager",
    "helper",
    "util",
    "stuff",
    "misc",
]

[replacements]
load = ["fetch", "retrieve", "obtain", "read_config"]
validate = ["assert_valid", "ensure_schema"]
extract = ["scrape", "harvest", "mine", "collect_ast"]
check = ["lint", "scan", "analyze", "inspect", "audit"]
split = ["tokenize", "segment", "chop", "explode"]
normalize = ["canonicalize", "standardize", "sanitize"]
format = ["render", "prettify", "stringify"]
build = ["construct", "make_object", "create_spec"]
discover = ["find_files", "locate_files", "crawl"]
matcher = ["spec", "file_filter", "path_rule"]
index = ["idx", "pos"]
error = ["err", "exc"]
