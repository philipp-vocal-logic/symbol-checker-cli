[settings]
include = ["src/**/*.py", "tests/**/*.py"]
exclude = []
forbidden_subwords = [
    "data",
    "info",
    "item",
    "obj",
    "val",
    "temp",
    "mgr",
    "manager",
    "helper",
    "util",
    "stuff",
    "misc",
]

[[terms]]
term = "load"
definition = "Read and deserialize a configuration or source text from a filesystem path."
forbidden_terms = ["fetch", "retrieve", "obtain", "read_config"]

[[terms]]
term = "validate"
definition = "Verify an in-memory schema object for internal consistency and non-ambiguity."
forbidden_terms = ["assert_valid", "ensure_schema"]

[[terms]]
term = "extract"
definition = "Traverse a syntax tree or raw structure to produce typed domain objects."
forbidden_terms = ["scrape", "harvest", "mine", "collect_ast"]

[[terms]]
term = "check"
definition = "Evaluate source code or schema entries against naming rules to produce findings."
forbidden_terms = ["lint", "scan", "analyze", "inspect", "audit"]

[[terms]]
term = "split"
definition = "Decompose a compound identifier string into normalized lowercase subwords."
forbidden_terms = ["tokenize", "segment", "chop", "explode"]

[[terms]]
term = "normalize"
definition = "Convert a subword sequence into its canonical lowercase singular form."
forbidden_terms = ["canonicalize", "standardize", "sanitize"]

[[terms]]
term = "format"
definition = "Produce a deterministic text representation of a finding or file path."
forbidden_terms = ["render", "prettify", "stringify"]

[[terms]]
term = "build"
definition = "Assemble a composite rule structure, matcher, or symbol instance from inputs."
forbidden_terms = ["construct", "make_object", "create_spec"]

[[terms]]
term = "discover"
definition = "Walk directory hierarchies to find non-ignored files matching include globs."
forbidden_terms = ["find_files", "locate_files", "crawl"]

[[terms]]
term = "matcher"
definition = "A compiled pathspec rule structure used to test whether a file path is matched or ignored."
forbidden_terms = ["spec", "filter_obj", "path_rule"]

[[terms]]
term = "index"
definition = "Zero-based integer offset within an ordered sequence."
forbidden_terms = ["idx", "pos"]

[[terms]]
term = "error"
definition = "An exception or failure condition encountered during parsing or file reading."
forbidden_terms = ["err", "exc"]
